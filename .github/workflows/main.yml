name: Build SweetPotato

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Install .NET Framework 4.6.1 Developer Pack
      run: choco install netfx-4.6.1-devpack -y --no-progress
      shell: powershell

    - name: Restore NuGet packages
      run: nuget restore SweetPotato.sln

    - name: Build
      run: msbuild SweetPotato.sln /p:Configuration=Release

    - name: List build output
      run: dir bin\Release
      shell: cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SweetPotato
        path: bin/Release/SweetPotato.exe
